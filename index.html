        // =================================================================
        // 2. 运行时间（纯本地计算，零延迟）
        // =================================================================
        (function updateUptimeNow() {
            var start = new Date('2025-12-18T18:00:00');
            var now = new Date();
            var diff = now - start;
            var days = Math.floor(diff / 86400000);
            var hours = Math.floor((diff % 86400000) / 3600000);
            var minutes = Math.floor((diff % 3600000) / 60000);
            var seconds = Math.floor((diff % 60000) / 1000);
            var el = document.getElementById('uptimeText');
            if (el) {
                el.textContent = '运行时间：' + days + '天 ' + hours + '小时 ' + minutes + '分钟 ' + seconds + '秒';
            }
        })();

        // =================================================================
        // 3. 北京时间（先用本地时间，后台异步同步）
        // =================================================================
        (function initBeijingTime() {
            var timeEl = document.getElementById('beijingTime');
            var dateEl = document.getElementById('beijingDate');

            function updateLocal() {
                var d = new Date();
                if (timeEl) {
                    timeEl.textContent = d.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit',
                        second: '2-digit' });
                }
                if (dateEl) {
                    dateEl.textContent = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric',
                        weekday: 'long' });
                }
            }
            updateLocal();

            // 每秒更新
            setInterval(updateLocal, 1000);

            // 后台异步同步北京时间（不阻塞首屏）
            if ('requestIdleCallback' in window) {
                requestIdleCallback(function() {
                    syncBeijingTime();
                });
            } else {
                setTimeout(syncBeijingTime, 100);
            }

            function syncBeijingTime() {
                fetch('https://worldtimeapi.org/api/timezone/Asia/Shanghai', { cache: 'no-cache', signal: AbortSignal
                        .timeout(3000) })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        var serverTime = new Date(data.datetime).getTime();
                        var offset = serverTime - Date.now();
                        // 用更精确的时间更新
                        setInterval(function() {
                            var d = new Date(Date.now() + offset);
                            if (timeEl) {
                                timeEl.textContent = d.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit',
                                    minute: '2-digit', second: '2-digit' });
                            }
                            if (dateEl) {
                                dateEl.textContent = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long',
                                    day: 'numeric', weekday: 'long' });
                            }
                        }, 1000);
                    })['catch'](function() { /* 静默降级到本地时间 */ });
            }
        })();

        // =================================================================
        // 4. 音乐加载（极简：直接使用 music.mp3，preload="metadata"）
        // =================================================================
        (function setupMusic() {
            var audio = document.getElementById('bgMusic');
            var btn = document.getElementById('musicButton');
            var icon = document.getElementById('musicIcon');
            var status = document.getElementById('lyricsStatus');

            // 预加载元数据后更新状态
            if (audio) {
                audio.addEventListener('loadedmetadata', function() {
                    if (status) {
                        status.innerHTML = '<i class="fas fa-check-circle"></i> <span>音乐已加载</span>';
                        status.className = 'lyrics-status success';
                    }
                });
                audio.addEventListener('error', function() {
                    if (status) {
                        status.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>音乐加载失败，请检查文件</span>';
                        status.className = 'lyrics-status error';
                    }
                });
                // 如果已经加载完成（缓存）
                if (audio.readyState >= 2) {
                    if (status) {
                        status.innerHTML = '<i class="fas fa-check-circle"></i> <span>音乐已加载</span>';
                        status.className = 'lyrics-status success';
                    }
                }
            }

            // 播放/暂停
            if (btn && audio) {
                btn.addEventListener('click', function() {
                    if (audio.paused) {
                        audio.play()['catch'](function() { /* 静默 */ });
                    } else {
                        audio.pause();
                    }
                });

                audio.addEventListener('play', function() {
                    icon.className = 'fas fa-pause';
                    btn.classList.add('playing');
                    btn.classList.add('lyrics-active');
                });
                audio.addEventListener('pause', function() {
                    icon.className = 'fas fa-play';
                    btn.classList.remove('playing');
                    btn.classList.remove('lyrics-active');
                });
                audio.addEventListener('ended', function() {
                    icon.className = 'fas fa-play';
                    btn.classList.remove('playing');
                    btn.classList.remove('lyrics-active');
                });
            }

            // 显示播放器
            var player = document.getElementById('musicPlayer');
            if (player) player.classList.add('show');
        })();

        // =================================================================
        // 5. 歌词系统（延迟加载，仅在用户展开时请求）
        // =================================================================
        (function setupLyrics() {
            var container = document.getElementById('lyricsContainer');
            var toggle = document.getElementById('lyricsToggle');
            var linesEl = document.getElementById('lyricsLines');
            var progressBar = document.getElementById('lyricsProgressBar');
            var statusEl = document.getElementById('lyricsStatus');
            var titleEl = document.getElementById('lyricsTitle');
            var audio = document.getElementById('bgMusic');
            var isCollapsed = true;
            var lyrics = [];
            var currentIndex = -1;
            var loaded = false;

            // 折叠切换
            if (toggle) {
                toggle.addEventListener('click', function() {
                    isCollapsed = !isCollapsed;
                    container.classList.toggle('collapsed');
                    var icon = toggle.querySelector('i');
                    var text = toggle.querySelector('span');
                    if (isCollapsed) {
                        icon.className = 'fas fa-chevron-up';
                        text.textContent = '展开';
                    } else {
                        icon.className = 'fas fa-chevron-down';
                        text.textContent = '收起';
                        // 首次展开时加载歌词
                        if (!loaded) loadLyrics();
                    }
                });
            }

            function loadLyrics() {
                if (loaded) return;
                loaded = true;
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fas fa-spinner"></i> <span>加载歌词中...</span>';
                    statusEl.className = 'lyrics-status loading';
                }
                fetch('歌词.lrc', { cache: 'no-cache', signal: AbortSignal.timeout(5000) })
                    .then(function(res) {
                        if (!res.ok) throw new Error('歌词文件不存在');
                        return res.text();
                    })
                    .then(function(text) {
                        parseLrc(text);
                        if (statusEl) {
                            statusEl.innerHTML = '<i class="fas fa-check-circle"></i> <span>歌词加载成功</span>';
                            statusEl.className = 'lyrics-status success';
                        }
                        if (titleEl && lyrics.length) {
                            titleEl.textContent = lyrics[0].title || '音乐';
                        }
                        renderLyrics();
                    })['catch'](function() {
                        if (statusEl) {
                            statusEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>歌词加载失败</span>';
                            statusEl.className = 'lyrics-status error';
                        }
                        titleEl.textContent = '暂无歌词';
                    });
            }

            function parseLrc(text) {
                var lines = text.split('\n');
                var result = [];
                var title = '';
                lines.forEach(function(line) {
                    var meta = line.match(/^\[(ti|ar|al):(.+)\]$/i);
                    if (meta) {
                        if (meta[1].toLowerCase() === 'ti') title = meta[2];
                        return;
                    }
                    var timeMatches = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/g);
                    var textMatch = line.match(/\].*$/);
                    if (timeMatches && textMatch) {
                        var txt = textMatch[0].substring(1).trim();
                        timeMatches.forEach(function(tm) {
                            var parts = tm.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
                            var sec = parseInt(parts[1]) * 60 + parseInt(parts[2]) + parseInt(parts[3]) / (parts[3]
                                .length === 2 ? 100 : 1000);
                            result.push({ time: sec, text: txt });
                        });
                    }
                });
                result.sort(function(a, b) { return a.time - b.time; });
                lyrics = result;
                if (title) lyrics.title = title;
            }

            function renderLyrics() {
                if (!linesEl) return;
                linesEl.innerHTML = '';
                lyrics.forEach(function(item, idx) {
                    var div = document.createElement('div');
                    div.className = 'lyrics-line';
                    div.textContent = item.text || '♪ ~ ♪';
                    div.dataset.index = idx;
                    div.addEventListener('click', function() {
                        if (audio && !isNaN(item.time)) {
                            audio.currentTime = item.time;
                            if (audio.paused) audio.play()['catch'](function() {});
                        }
                    });
                    linesEl.appendChild(div);
                });
            }

            // 时间更新
            if (audio) {
                audio.addEventListener('timeupdate', function() {
                    if (audio.paused || lyrics.length === 0) return;
                    var ct = audio.currentTime;
                    var idx = -1;
                    for (var i = lyrics.length - 1; i >= 0; i--) {
                        if (ct >= lyrics[i].time) { idx = i; break; }
                    }
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        var all = linesEl.querySelectorAll('.lyrics-line');
                        all.forEach(function(el) { el.classList.remove('active'); });
                        if (idx >= 0 && all[idx]) {
                            all[idx].classList.add('active');
                            // 滚动到可视区域
                            var containerHeight = linesEl.parentElement.clientHeight;
                            var lineHeight = all[idx].offsetHeight || 40;
                            var offset = all[idx].offsetTop - (containerHeight / 2) + (lineHeight / 2);
                            if (offset > 0) {
                                linesEl.style.transform = 'translateY(-' + offset + 'px)';
                            } else {
                                linesEl.style.transform = 'translateY(0)';
                            }
                        }
                    }
                    var total = lyrics.length ? lyrics[lyrics.length - 1].time : 1;
                    var pct = Math.min((ct / total) * 100, 100);
                    if (progressBar) progressBar.style.width = pct + '%';
                });
            }
        })();

        // =================================================================
        // 6. 粒子系统（延迟初始化，不阻塞首屏）
        // =================================================================
        (function initParticles() {
            var isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (isReduced) return;

            var canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var particles = [];
            var mouse = { x: -1000, y: -1000 };
            var animId = null;
            var isPerformance = true;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            function createParticles() {
                var count = Math.min(80, Math.floor((window.innerWidth * window.innerHeight) / 15000));
                particles = [];
                var colors = ['#7c5aa0', '#6d7aea', '#ec8bf7'];
                for (var i = 0; i < count; i++) {
                    var c = colors[i % 3];
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() - 0.5) * 0.6,
                        r: 1.5 + Math.random() * 2.5,
                        op: 0.3 + Math.random() * 0.5,
                        color: c,
                        breath: Math.random() * Math.PI * 2,
                        trail: []
                    });
                }
            }
            createParticles();

            // 鼠标追踪
            var onMove = function(e) {
                mouse.x = e.clientX || e.pageX || 0;
                mouse.y = e.clientY || e.pageY || 0;
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', function(e) {
                if (e.touches.length) {
                    var t = e.touches[0];
                    mouse.x = t.clientX;
                    mouse.y = t.clientY;
                }
            }, { passive: true });
            window.addEventListener('mouseleave', function() { mouse.x = -1000;
                mouse.y = -1000; });

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                var now = Date.now();

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var dx = mouse.x - p.x;
                    var dy = mouse.y - p.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150 && dist > 0) {
                        var force = (1 - dist / 150) * 0.03;
                        var angle = Math.atan2(dy, dx);
                        if (dist < 40) {
                            p.vx -= Math.cos(angle) * force * 2;
                            p.vy -= Math.sin(angle) * force * 2;
                        } else {
                            p.vx += Math.cos(angle) * force * 0.5;
                            p.vy += Math.sin(angle) * force * 0.5;
                        }
                    }

                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < p.r || p.x > canvas.width - p.r) { p.vx *= -0.8;
                        p.x = Math.max(p.r, Math.min(canvas.width - p.r, p.x)); }
                    if (p.y < p.r || p.y > canvas.height - p.r) { p.vy *= -0.8;
                        p.y = Math.max(p.r, Math.min(canvas.height - p.r, p.y)); }

                    // 呼吸
                    var scale = 1 + Math.sin(now * 0.003 + p.breath) * 0.15;
                    var rad = p.r * scale;

                    // 拖尾
                    p.trail.push({ x: p.x, y: p.y });
                    if (p.trail.length > 6) p.trail.shift();
                    for (var j = 0; j < p.trail.length; j++) {
                        var t = p.trail[j];
                        ctx.globalAlpha = (j / p.trail.length) * p.op * 0.3;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, rad * (j / p.trail.length), 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalAlpha = p.op;
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = p.color + '60';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // 连线
                ctx.globalAlpha = 0.3;
                ctx.strokeStyle = 'rgba(102,126,234,0.3)';
                ctx.lineWidth = 1;
                for (var a = 0; a < particles.length; a++) {
                    for (var b = a + 1; b < particles.length; b++) {
                        var dx2 = particles[b].x - particles[a].x;
                        var dy2 = particles[b].y - particles[a].y;
                        var d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                        if (d2 < 100) {
                            ctx.globalAlpha = (1 - d2 / 100) * 0.3;
                            ctx.beginPath();
                            ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.stroke();
                        }
                    }
                }
                ctx.globalAlpha = 1;

                animId = requestAnimationFrame(animate);
            }

            // 延迟启动粒子动画
            var startParticles = function() {
                if (!animId) animate();
            };

            if ('requestIdleCallback' in window) {
                requestIdleCallback(startParticles, { timeout: 500 });
            } else {
                setTimeout(startParticles, 300);
            }

            // 性能模式切换
            var perfToggle = document.getElementById('performanceToggle');
            if (perfToggle) {
                perfToggle.addEventListener('change', function() {
                    isPerformance = this.checked;
                    if (!isPerformance && animId) {
                        cancelAnimationFrame(animId);
                        animId = null;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    } else if (isPerformance && !animId) {
                        animate();
                    }
                });
            }

            // 暴露给设置系统
            window._particleSystem = {
                start: function() { if (!animId) animate(); },
                stop: function() { if (animId) { cancelAnimationFrame(animId);
                        animId = null; } },
                isRunning: function() { return !!animId; }
            };
        })();

        // =================================================================
        // 7. 导航、菜单、模态框等交互
        // =================================================================
        (function setupUI() {
            // 导航
            var navItems = document.querySelectorAll('.nav-menu li[data-page]');
            navItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    var page = this.dataset.page;
                    if (page === 'settings') {
                        settingsSystem && settingsSystem.show();
                        return;
                    }
                    navigateTo(page);
                });
            });

            function navigateTo(pageName) {
                var current = document.querySelector('.page.active');
                var target = document.getElementById('page-' + pageName);
                if (current === target) return;
                if (!target) return;

                document.querySelectorAll('.page').forEach(function(p) {
                    p.style.pointerEvents = 'none';
                    p.style.display = 'none';
                });
                current.classList.add('fade-out');

                setTimeout(function() {
                    document.querySelectorAll('.page').forEach(function(p) {
                        p.classList.remove('active', 'fade-out');
                    });
                    target.style.display = 'block';
                    target.style.pointerEvents = 'auto';
                    setTimeout(function() {
                        target.classList.add('active');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        document.body.style.overflow = '';
                    }, 10);
                }, 250);

                document.querySelectorAll('.nav-menu li').forEach(function(l) { l.classList.remove('active'); });
                var activeLi = document.querySelector('.nav-menu li[data-page="' + pageName + '"]');
                if (activeLi) activeLi.classList.add('active');

                var menu = document.getElementById('navMenu');
                if (menu) menu.classList.remove('active');
                var icon = document.querySelector('#mobileToggle i');
                if (icon) { icon.classList.add('fa-bars');
                    icon.classList.remove('fa-times'); }
            }

            // 移动端菜单
            var toggleBtn = document.getElementById('mobileToggle');
            var navMenu = document.getElementById('navMenu');
            if (toggleBtn && navMenu) {
                toggleBtn.addEventListener('click', function() {
                    navMenu.classList.toggle('active');
                    var icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-bars');
                        icon.classList.toggle('fa-times');
                    }
                });
                navMenu.querySelectorAll('li').forEach(function(li) {
                    li.addEventListener('click', function() {
                        navMenu.classList.remove('active');
                        var icon = toggleBtn.querySelector('i');
                        if (icon) { icon.classList.add('fa-bars');
                            icon.classList.remove('fa-times'); }
                    });
                });
            }

            // 模态框
            var modalOverlay = document.getElementById('homeworkModal');
            var modalClose = document.getElementById('modalClose');
            var modalButton = document.getElementById('modalButton');
            if (modalClose) modalClose.addEventListener('click', function() { hideModal(); });
            if (modalButton) modalButton.addEventListener('click', function() { hideModal(); });
            if (modalOverlay) {
                modalOverlay.addEventListener('click', function(e) {
                    if (e.target === this) hideModal();
                });
            }

            function hideModal() {
                if (modalOverlay) modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            window.hideHomeworkModal = hideModal;
            window.showHomeworkModal = function() { /* 占位 */ };

            // 设置系统
            var settingsModal = document.getElementById('settingsModal');
            var settingsClose = document.getElementById('settingsClose');
            var perfToggle = document.getElementById('performanceToggle');
            var transitionOverlay = document.getElementById('transitionOverlay');

            var settingsSystem = {
                show: function() {
                    if (settingsModal) {
                        settingsModal.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        if (perfToggle) {
                            perfToggle.checked = document.body.classList.contains('performance-mode');
                        }
                    }
                },
                hide: function() {
                    if (settingsModal) {
                        settingsModal.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                }
            };
            window.settingsSystem = settingsSystem;

            if (settingsClose) {
                settingsClose.addEventListener('click', function() { settingsSystem.hide(); });
            }
            if (settingsModal) {
                settingsModal.addEventListener('click', function(e) {
                    if (e.target === this) settingsSystem.hide();
                });
            }
            if (perfToggle) {
                perfToggle.addEventListener('change', function() {
                    var mode = this.checked ? 'performance' : 'compatibility';
                    // 显示过渡
                    if (transitionOverlay) transitionOverlay.classList.add('active');
                    setTimeout(function() {
                        document.body.classList.toggle('performance-mode', mode === 'performance');
                        document.body.classList.toggle('compatibility-mode', mode === 'compatibility');
                        localStorage.setItem('performanceMode', mode);
                        // 粒子系统切换
                        var ps = window._particleSystem;
                        if (ps) {
                            if (mode === 'performance') ps.start();
                            else ps.stop();
                        }
                        if (transitionOverlay) {
                            setTimeout(function() {
                                transitionOverlay.classList.remove('active');
                            }, 400);
                        }
                    }, 300);
                });
                // 恢复上次设置
                var saved = localStorage.getItem('performanceMode');
                if (saved === 'compatibility') {
                    perfToggle.checked = false;
                    document.body.classList.remove('performance-mode');
                    document.body.classList.add('compatibility-mode');
                } else {
                    perfToggle.checked = true;
                    document.body.classList.add('performance-mode');
                    document.body.classList.remove('compatibility-mode');
                }
            }

            // 键盘 ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (settingsModal && settingsModal.classList.contains('active')) settingsSystem.hide();
                    if (modalOverlay && modalOverlay.classList.contains('active')) hideModal();
                    if (navMenu && navMenu.classList.contains('active')) {
                        navMenu.classList.remove('active');
                        var icon = toggleBtn.querySelector('i');
                        if (icon) { icon.classList.add('fa-bars');
                            icon.classList.remove('fa-times'); }
                    }
                }
            });

            // 窗口resize关闭移动菜单
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && navMenu) {
                    navMenu.classList.remove('active');
                    var icon = toggleBtn.querySelector('i');
                    if (icon) { icon.classList.add('fa-bars');
                        icon.classList.remove('fa-times'); }
                }
            });
        })();
