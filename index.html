<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>GLcn - Hello</title>

    <!-- ===== 优化1：提前加载关键CSS，阻塞最小化 ===== -->
    <style>
        /* ---------- 关键样式：首屏可见部分 ---------- */
        :root {
            --primary: #6d7aea;
            --primary-dark: #5a67d8;
            --secondary: #7c5aa0;
            --accent: #ec8bf7;
            --accent-secondary: #f5576c;
            --dark: #1a1a2e;
            --darker: #16213e;
            --darkest: #0f172a;
            --light: #f8fafc;
            --lighter: #e2e8f0;
            --text: #e2e8f0;
            --text-light: #a0aec0;
            --text-muted: #718096;
            --white: #ffffff;
            --success: #4ade80;
            --warning: #f59e0b;
            --danger: #f87171;
            --info: #60a5fa;
            --subject-chinese: #e53e3e;
            --subject-math: #3182ce;
            --subject-english: #38a169;
            --subject-physics: #d69e2e;
            --subject-chemistry: #805ad5;
            --subject-politics: #dd6b20;
            --subject-other: #718096;

            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-spring: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);

            --duration-fast: 0.25s;
            --duration-normal: 0.4s;
            --duration-slow: 0.6s;
            --duration-mega-slow: 0.8s;

            --border-radius: 16px;
            --border-radius-sm: 8px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.4);

            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --spacing-xxl: 4rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 70px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            font-size: clamp(0.95rem, 4vw, 1.05rem);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all var(--duration-normal) var(--transition-smooth);
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(240, 147, 251, 0.04) 0%, transparent 50%);
            animation: backgroundShift 25s ease-in-out infinite;
            z-index: -1;
            will-change: transform;
        }
        @keyframes backgroundShift {
            0%,
            100% {
                opacity: 0.3;
                transform: rotate(0deg) scale(1);
            }
            50% {
                opacity: 0.6;
                transform: rotate(3deg) scale(1.05);
            }
        }

        /* 粒子画布占位 — 不阻塞渲染 */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            will-change: transform;
        }

        /* ---------- 导航栏 ---------- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
            transition: all var(--duration-normal) var(--transition-smooth);
            transform: translateY(0);
            will-change: transform;
        }
        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) clamp(1rem, 5vw, 2rem);
            min-height: 70px;
        }
        .logo {
            font-size: clamp(1.6rem, 5vw, 1.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--duration-slow) var(--transition-spring);
            cursor: pointer;
        }
        .logo:hover {
            transform: scale(1.05) translateY(-2px);
            filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.4));
        }
        .nav-menu {
            display: flex;
            gap: clamp(1rem, 3vw, 2.5rem);
            list-style: none;
        }
        .nav-menu li {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            padding: var(--spacing-xs) 0;
            position: relative;
            transition: all var(--duration-normal) var(--transition-spring);
            user-select: none;
        }
        .nav-menu li::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            border-radius: 1px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: all var(--duration-normal) var(--transition-bounce);
        }
        .nav-menu li:hover::after,
        .nav-menu li.active::after {
            width: 100%;
        }
        .nav-menu li:hover {
            color: var(--white);
            transform: translateY(-2px) scale(1.02);
        }
        .nav-menu li.active {
            color: var(--primary);
            transform: translateY(-1px);
        }
        .mobile-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            min-width: 88px;
            min-height: 44px;
            border-radius: var(--border-radius-lg);
            transition: all var(--duration-fast) var(--transition-bounce);
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }
        .mobile-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
        }
        .mobile-toggle:active {
            transform: scale(0.95);
        }
        .mobile-toggle span {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ---------- 页面 ---------- */
        .page {
            display: none;
            flex: 1;
            padding: var(--spacing-md);
            opacity: 0;
            transform: translateY(20px);
            transition: all var(--duration-mega-slow) var(--transition-smooth);
            height: auto;
            min-height: calc(100vh - 70px);
        }
        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .page.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }
        .page-content {
            padding-top: 70px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Hero ---------- */
        .hero {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, var(--secondary) 100%);
            color: white;
            text-align: center;
            padding: clamp(2rem, 6vw, 4rem) clamp(1rem, 5vw, 2rem);
            position: relative;
            overflow: hidden;
            border-radius: var(--border-radius-lg);
            margin: var(--spacing-sm) auto;
            box-shadow: var(--shadow-xl);
            max-width: 1200px;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(240, 147, 251, 0.15) 0%, transparent 50%);
            animation: heroPulse 8s var(--transition-smooth) infinite;
            z-index: 1;
        }
        @keyframes heroPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.02);
            }
        }
        .hero-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero h1 {
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
            position: relative;
            z-index: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s var(--transition-ease-out) forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #beijingTime {
            font-size: clamp(2rem, 8vw, 3.2rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 0.05em;
            animation: timeGlow 2s var(--transition-smooth) infinite alternate;
        }
        @keyframes timeGlow {
            from {
                filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3));
            }
            to {
                filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6));
            }
        }
        .time-date {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 1.5rem;
            animation: fadeInUp 1s var(--transition-ease-out) forwards 0.3s;
        }
        .uptime-display {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius);
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            justify-content: center;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            transition: all var(--duration-normal) var(--transition-smooth);
            animation: fadeInUp 1s var(--transition-ease-out) forwards 0.6s;
        }
        .uptime-display:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-glow);
        }
        .uptime-icon {
            font-size: 1.2rem;
            color: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .ua-display {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius);
            padding: var(--spacing-sm) var(--spacing-md);
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: rgba(255, 255, 255, 0.9);
            transition: all var(--duration-normal) var(--transition-smooth);
            justify-content: center;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            animation: fadeInUp 1s var(--transition-ease-out) forwards 1s;
        }
        .ua-display:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-glow);
        }
        .ua-icon {
            font-size: 1.2rem;
        }
        .ua-pc {
            color: var(--primary);
        }
        .ua-ios {
            color: var(--success);
        }
        .ua-android {
            color: var(--warning);
        }
        .ua-mobile {
            color: var(--accent);
        }
        .ua-wechat {
            color: #07C160;
        }
        .ua-qq {
            color: #12B7F5;
        }

        .stn-studio-display {
            position: relative;
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 700;
            color: var(--white);
            text-align: center;
            animation: fadeInUp 1s var(--transition-ease-out) forwards 0.9s, stnGlow 3s ease-in-out infinite;
            transition: all var(--duration-normal) var(--transition-smooth);
            overflow: hidden;
        }
        .stn-studio-display::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, transparent, rgba(102, 126, 234, 0.3), rgba(240, 147, 251, 0.3), transparent);
            animation: stnRotate 4s linear infinite;
            z-index: -1;
            border-radius: 50px;
        }
        .stn-studio-display::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: var(--dark);
            border-radius: 48px;
            z-index: -1;
        }
        @keyframes stnRotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        @keyframes stnGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(72, 187, 120, 0.6), 0 0 40px rgba(240, 147, 251, 0.3);
            }
        }
        .stn-studio-display:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* ---------- 功能卡片 ---------- */
        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            text-align: center;
            transition: all var(--duration-normal) var(--transition-bounce);
            position: relative;
            overflow: hidden;
            margin: var(--spacing-md) auto;
            max-width: 800px;
        }
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left var(--duration-mega-slow) var(--transition-smooth);
        }
        .feature-card:hover::before {
            left: 100%;
        }
        .feature-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .feature-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: var(--spacing-md);
            transition: all var(--duration-normal) var(--transition-bounce);
            display: inline-block;
        }
        .feature-card:hover .feature-icon {
            transform: scale(1.1) rotate(5deg);
            color: var(--accent);
        }
        .feature-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--white);
        }
        .feature-description {
            color: var(--text-light);
            line-height: 1.6;
        }
        .modal-button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-fast) var(--transition-bounce);
            margin-top: var(--spacing-md);
        }
        .modal-button:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: var(--shadow-glow);
        }

        /* ---------- 歌词 ---------- */
        .lyrics-container {
            position: relative;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transition: all var(--duration-normal) var(--transition-smooth);
            transform: translateY(0);
        }
        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
        }
        .lyrics-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .lyrics-title i {
            color: var(--accent);
            animation: musicPulse 2s ease-in-out infinite;
        }
        .lyrics-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all var(--duration-fast) var(--transition-smooth);
            font-size: 0.9rem;
        }
        .lyrics-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            transform: translateY(-2px);
        }
        .lyrics-wrapper {
            position: relative;
            height: 300px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            transition: height var(--duration-normal) var(--transition-smooth);
        }
        .lyrics-lines {
            position: absolute;
            width: 100%;
            transition: transform 0.3s var(--transition-smooth);
        }
        .lyrics-line {
            padding: 1rem 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            transition: all 0.4s var(--transition-bounce);
            cursor: pointer;
            opacity: 0.7;
            transform: scale(0.95);
            user-select: none;
            position: relative;
        }
        .lyrics-line:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--border-radius);
            transform: scale(0.98);
        }
        .lyrics-line.active {
            color: var(--white);
            font-size: 1.3rem;
            font-weight: 600;
            opacity: 1;
            transform: scale(1);
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        .lyrics-line.active::before {
            content: '♪';
            position: absolute;
            left: 1rem;
            color: var(--accent);
            animation: pulse 1s ease-in-out infinite;
        }
        .lyrics-line.active::after {
            content: '♪';
            position: absolute;
            right: 1rem;
            color: var(--accent);
            animation: pulse 1s ease-in-out infinite;
        }
        .lyrics-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0 0 var(--border-radius-lg) var(--border-radius-lg);
            overflow: hidden;
        }
        .lyrics-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        .lyrics-status {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            gap: 0.5rem;
            transition: all var(--duration-fast) var(--transition-smooth);
        }
        .lyrics-status i {
            font-size: 1.1rem;
            transition: all var(--duration-fast) var(--transition-smooth);
        }
        .lyrics-status.loading i {
            animation: fa-spin 1s linear infinite;
        }
        .lyrics-status.error {
            color: var(--danger);
        }
        .lyrics-status.success {
            color: var(--success);
        }
        .lyrics-container.collapsed {
            transform: translateY(calc(100% - 60px)) scale(0.98);
            box-shadow: var(--shadow-md);
            opacity: 0.9;
        }
        .lyrics-container.collapsed .lyrics-wrapper {
            height: 0;
            opacity: 0;
        }
        .lyrics-container.collapsed .lyrics-progress {
            opacity: 0;
        }
        .lyrics-container.collapsed .lyrics-status {
            padding: 0.5rem;
        }

        /* ---------- 关于我们 / 历史 ---------- */
        .history-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--spacing-lg) 0;
            min-height: calc(100vh - 300px);
        }
        .history-container {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--spacing-lg) 0;
            width: 100%;
        }
        .history-banner {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-lg);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            margin-left: auto;
            margin-right: auto;
            max-width: 800px;
        }
        .history-banner-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: var(--spacing-md);
            animation: pulse 2s ease-in-out infinite;
        }
        .history-banner-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: var(--spacing-sm);
        }
        .history-banner-subtitle {
            color: var(--text-light);
            font-size: 1rem;
        }
        .current-version-banner {
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-lg);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .current-version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }
        .current-version-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        .current-version-title i {
            animation: fa-spin 2s linear infinite;
        }
        .current-version-badge {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--white);
            background: linear-gradient(135deg, var(--warning), var(--accent));
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius-sm);
            box-shadow: var(--shadow-sm);
            animation: pulse 2s ease-in-out infinite;
        }
        .current-version-text {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .history-timeline {
            position: relative;
            padding-left: var(--spacing-lg);
            margin-left: auto;
            margin-right: auto;
            max-width: 800px;
        }
        .history-timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
            border-radius: 2px;
        }
        .history-item {
            position: relative;
            margin-bottom: var(--spacing-xl);
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInLeft 0.6s var(--transition-smooth) forwards;
        }
        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .history-item::before {
            content: '';
            position: absolute;
            left: -2.5rem;
            top: 1.5rem;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border: 3px solid var(--dark);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            z-index: 1;
            transition: all var(--duration-normal) var(--transition-bounce);
        }
        .history-item:hover::before {
            transform: scale(1.2);
            box-shadow: 0 0 15px var(--accent);
            background: var(--accent);
        }
        .history-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            transition: all var(--duration-normal) var(--transition-bounce);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        .history-card:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }
        .history-date {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        .history-date i {
            font-size: 0.9rem;
            color: var(--primary);
        }
        .history-version {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--white);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius-sm);
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.5px;
        }
        .history-changes {
            list-style: none;
            padding-left: 0;
            margin: var(--spacing-sm) 0 0 0;
        }
        .history-change {
            padding: var(--spacing-xs) 0;
            color: var(--text-light);
            position: relative;
            padding-left: var(--spacing-md);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .history-change::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .history-change:not(:last-child) {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .feedback-section {
            margin-top: var(--spacing-xl);
            padding: 0 var(--spacing-md);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ---------- 音乐播放器 ---------- */
        .music-player {
            position: fixed;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            z-index: 999;
            opacity: 0;
            transform: scale(0);
            transition: all var(--duration-slow) var(--transition-bounce);
        }
        .music-player.show {
            opacity: 1;
            transform: scale(1);
        }
        .music-button {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all var(--duration-normal) var(--transition-bounce);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .music-button:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            background: rgba(255, 255, 255, 0.15);
        }
        .music-button:active {
            transform: scale(0.95);
        }
        .music-button.playing {
            animation: musicPulse 2s ease-in-out infinite;
        }
        @keyframes musicPulse {
            0%,
            100% {
                box-shadow: var(--shadow-lg), 0 0 0 0 rgba(102, 126, 234, 0.4);
            }
            50% {
                box-shadow: var(--shadow-xl), 0 0 0 10px rgba(102, 126, 234, 0);
            }
        }
        .music-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            opacity: 0;
            transition: all var(--duration-normal) var(--transition-smooth);
            z-index: -1;
        }
        .music-button:hover::before {
            opacity: 0.3;
        }
        .music-button.lyrics-active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            animation: musicPulse 2s ease-in-out infinite;
        }
        .music-button.lyrics-active:hover {
            box-shadow: var(--shadow-xl), 0 0 30px rgba(102, 126, 234, 0.6);
        }

        /* ---------- 模态框 ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration-normal) var(--transition-smooth);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.8) translateY(50px);
            transition: all var(--duration-slow) var(--transition-bounce);
            position: relative;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
            padding: var(--spacing-xs);
            border-radius: var(--border-radius-sm);
            transition: all var(--duration-fast) var(--transition-smooth);
        }
        .modal-close:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
        }
        .modal-body {
            color: var(--text-light);
            line-height: 1.6;
        }
        .modal-body h4 {
            color: var(--white);
            margin-bottom: var(--spacing-sm);
            font-size: 1.1rem;
        }
        .modal-body p {
            margin-bottom: var(--spacing-md);
        }
        .modal-footer {
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* ---------- 设置 ---------- */
        .settings-modal {
            max-width: 500px;
            width: 90%;
        }
        .settings-body {
            padding: 1.5rem 0;
        }
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all var(--duration-normal) var(--transition-bounce);
        }
        .setting-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }
        .setting-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .setting-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            box-shadow: var(--shadow-sm);
            transition: all var(--duration-fast) var(--transition-bounce);
        }
        .setting-item:hover .setting-icon {
            transform: scale(1.1) rotate(10deg);
            box-shadow: var(--shadow-glow);
        }
        .setting-text {
            flex: 1;
        }
        .setting-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 0.25rem;
        }
        .setting-description {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .toggle-switch {
            position: relative;
            width: 140px;
            height: 45px;
            cursor: pointer;
            user-select: none;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 45px;
            transition: all var(--duration-normal) var(--transition-bounce);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: var(--shadow-sm);
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 41px;
            height: 41px;
            background: linear-gradient(135deg, var(--white), var(--lighter));
            border-radius: 50%;
            transition: all var(--duration-normal) var(--transition-bounce);
            box-shadow: var(--shadow-md);
            z-index: 2;
        }
        .toggle-switch input:checked+.toggle-slider::before {
            transform: translateX(95px);
            background: linear-gradient(135deg, var(--accent), var(--primary));
        }
        .toggle-switch input:checked+.toggle-slider {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .toggle-label {
            font-size: 0.75rem;
            font-weight: 600;
            position: relative;
            z-index: 1;
            transition: all var(--duration-fast) var(--transition-smooth);
            padding: 0.25rem 0.5rem;
            border-radius: var(--border-radius-sm);
        }
        .toggle-label.performance {
            color: var(--success);
        }
        .toggle-label.compatibility {
            color: var(--warning);
        }
        .toggle-switch input:not(:checked)+.toggle-slider .performance,
        .toggle-switch input:checked+.toggle-slider .compatibility {
            background: rgba(255, 255, 255, 0.15);
            color: var(--white);
            transform: scale(1.05);
        }

        /* ---------- 过渡遮罩 ---------- */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--darker), var(--dark));
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration-normal) var(--transition-smooth);
            backdrop-filter: blur(20px);
        }
        .transition-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .transition-content {
            text-align: center;
            padding: 2rem;
            border-radius: var(--border-radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-xl);
        }
        .transition-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 0 auto 1rem;
        }
        .transition-text {
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 600;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ---------- footer ---------- */
        footer {
            background: var(--darkest);
            color: rgba(255, 255, 255, 0.8);
            padding: var(--spacing-lg) clamp(1rem, 5vw, 2rem);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-top: auto;
        }
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            transition: all var(--duration-normal) var(--transition-smooth);
        }
        .footer-content:hover {
            color: var(--white);
            transform: translateY(-2px);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            .nav-menu {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: rgba(26, 26, 46, 0.95);
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding-top: var(--spacing-xl);
                transition: left 0.5s var(--transition-bounce);
                backdrop-filter: blur(20px);
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            .nav-menu li {
                width: 80%;
                text-align: center;
                padding: var(--spacing-md);
                margin: var(--spacing-xs) 0;
                border-radius: var(--border-radius);
                transition: all var(--duration-normal) var(--transition-smooth);
            }
            .nav-menu li:hover {
                background: rgba(102, 126, 234, 0.1);
                transform: translateX(5px);
            }
            .nav-menu li::after {
                left: 50%;
                transform: translateX(-50%);
            }
            .nav-menu.active {
                left: 0;
            }
            .mobile-toggle {
                display: flex;
            }
            .hero {
                margin: var(--spacing-xs) auto;
                padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 1.5rem);
            }
            #beijingTime {
                font-size: clamp(1.8rem, 6vw, 2.5rem);
            }
            .time-date {
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            }
            .uptime-display {
                font-size: clamp(0.8rem, 2vw, 0.95rem);
                padding: var(--spacing-xs) var(--spacing-sm);
            }
            .ua-display {
                font-size: clamp(0.8rem, 2vw, 0.95rem);
                padding: var(--spacing-xs) var(--spacing-sm);
            }
            .stn-studio-display {
                padding: 0.8rem 1.5rem;
                font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            }
            .modal-content {
                width: 95%;
                padding: var(--spacing-lg);
                margin: var(--spacing-md);
            }
            .lyrics-container {
                margin: 1rem auto;
                border-radius: var(--border-radius);
            }
            .lyrics-wrapper {
                height: 250px;
            }
            .lyrics-line {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
            .lyrics-line.active {
                font-size: 1.1rem;
            }
            .lyrics-line.active::before,
            .lyrics-line.active::after {
                display: none;
            }
            .lyrics-title {
                font-size: 1.1rem;
            }
            .lyrics-toggle {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
            .history-timeline {
                padding-left: var(--spacing-md);
            }
            .history-item::before {
                left: -2rem;
            }
            .history-banner {
                margin: 0 var(--spacing-sm) var(--spacing-lg);
                padding: var(--spacing-md);
            }
            .history-banner-title {
                font-size: 1.5rem;
            }
            .history-banner-icon {
                font-size: 2.5rem;
            }
            .current-version-banner {
                margin: 0 var(--spacing-sm) var(--spacing-lg);
            }
            .history-card {
                padding: var(--spacing-md);
            }
            .history-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .history-version {
                align-self: flex-start;
            }
            .settings-modal {
                width: 95%;
                margin: 1rem;
            }
            .setting-item {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .toggle-switch {
                align-self: flex-end;
            }
        }
        @media (max-width: 480px) {
            .page {
                padding: var(--spacing-sm);
            }
            .hero {
                padding: clamp(1.2rem, 4vw, 2.5rem) clamp(0.5rem, 3vw, 1rem);
            }
            #beijingTime {
                font-size: clamp(1.6rem, 5vw, 2.2rem);
            }
            .time-date {
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            }
            .uptime-display {
                font-size: clamp(0.75rem, 2vw, 0.9rem);
            }
            .ua-display {
                font-size: clamp(0.8rem, 2vw, 0.95rem);
            }
            .stn-studio-display {
                padding: 0.6rem 1.2rem;
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            }
            .lyrics-wrapper {
                height: 200px;
            }
            .lyrics-line {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
            .lyrics-line.active {
                font-size: 1rem;
            }
            .history-timeline {
                padding-left: var(--spacing-sm);
            }
            .history-item::before {
                left: -1.8rem;
            }
            .history-date {
                font-size: 1rem;
            }
            .history-version {
                font-size: 1.1rem;
            }
        }

        /* ---------- 滚动条 ---------- */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--accent));
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(var(--primary-dark), var(--accent-secondary));
        }
        ::selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--white);
        }
        *:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .stagger-fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: staggerFadeIn 0.6s var(--transition-bounce) forwards;
        }
        @keyframes staggerFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        body.compatibility-mode #particles-canvas,
        body.compatibility-mode .music-player,
        body.compatibility-mode .lyrics-container {
            display: none !important;
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var type = 'PC',
                icon = 'fa-desktop',
                cls = 'ua-pc';
            if (/iphone|ipad|ipod/.test(ua)) {

                icon = 'fa-mobile-alt';

                type = 'QQ端';
                icon = 'fa-comment';
                cls = 'ua-qq';
            } else if (/windows|macintosh|linux/.test(ua) && !/mobile/.test(ua)) {

                icon = 'fa-mobile-alt';

    <!-- ===== 优化4：主脚本 defer 加载，不阻塞 HTML 解析 ===== -->
    <script defer>
        // =================================================================
        // 1. 立即渲染 UA（利用预存的 _uaInfo）

        (function renderUA() {
